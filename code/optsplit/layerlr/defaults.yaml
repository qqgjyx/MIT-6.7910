# Defaults of the `balance` section of a run config (merged under it by optsplit.layerlr.balance_cfg; the core
# defaults in configs/defaults.yaml have no `balance`, and a run without `balance.variant` never imports layerlr).
balance:                      # curvature-balanced per-layer learning rates (optsplit/layerlr/balance.py)
  variant: null               # null (off) | A (redistribute) | B (redistribute and scale to a target) |
                              # R (v2: equalize each layer's curvature along its step, on fresh sequences) |
                              # F (no balancing: fixed multipliers `mults`, {block: m_a}, others at 1; with
                              #    `ramp: [a, b]`, m_a^f with f rising linearly from 0 at step a to 1 at step b)
  blocks: layer               # layer | sublayer (attention and MLP of each block apart)
  every: 20                   # steps between refreshes of the top eigenvectors and the multipliers
  k: 3                        # tracked eigenvectors (shares are averaged over those within `cluster` of the top)
  iters: 2                    # block iterations per refresh (k (iters + 1) Hessian-vector products)
  cluster: 0.05
  ema: 0.2                    # weight of the new shares in their moving average
  alpha: 0.3                  # A: step of log m_a per refresh
  target: 0.9                 # B: lambda_max of the balanced operator, as a fraction of the threshold
  gain: 0.2                   # B: step of log g per refresh, times log(lambda / target)
  clip: [0.1, 10.0]           # every per-layer rate stays within these multiples of the schedule's rate
  start: null                 # first step that updates the multipliers (null: end of warmup)
  fixed: []                   # blocks kept at the schedule's rate (still in the operator)
  fresh: false                # true: Hessian on fresh training sequences at every refresh, not the fixed batch
  pop_seqs: 256               # R: fresh training sequences per refresh
  chunk: 32                   # R: sequences per Hessian-vector product pass (memory)
  own: false                  # R: numerator s_a^T H_aa s_a (the layer's own block) instead of s_a^T (H s)_a
  check_every: 500            # full Lanczos check of the tracked lambda_max (Muon: Frank-Wolfe from scratch)
  fw_iters: 5                 # Muon: Frank-Wolfe steps per refresh
