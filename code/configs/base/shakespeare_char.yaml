# nanoGPT's "baby GPT" on character-level Shakespeare (config/train_shakespeare_char.py), without dropout.
# ~10.7M parameters on 1M characters: without dropout the validation loss is lowest around step 1000
# and rises after, so runs stop at 1500 steps (~1-2 min on one GPU) instead of nanoGPT's 5000.
task: gpt
dataset: shakespeare_char
model: {block_size: 256, n_layer: 6, n_head: 6, n_embd: 384}
train: {batch_size: 64, max_steps: 1500}
optim:
  adamw: {lr: 1.0e-3, betas: [0.9, 0.99]}
schedule: {warmup_steps: 100, decay: cosine, min_lr_frac: 0.1}
log:
  eval_steps: {every: 50, geometric: 40}
  ckpt_steps: {every: 250, geometric: 12}
probe: {n_seqs: 64, positions_per_seq: 0, train_seqs: 64}
measure:
  steps: {every: 50, geometric: 30}
