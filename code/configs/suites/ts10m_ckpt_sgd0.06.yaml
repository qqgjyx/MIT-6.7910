# ts10m_main_sgd0.06 again, with checkpoints also at the measurement steps up to 2500, where SGD at 0.06 is at its
# threshold (steps 45-788): the curvature heatmaps (curvature_layers) need the weights at those steps, which the
# checkpoint grid of ts10m_main_sgd0.06 misses.
suite: ts10m_ckpt_sgd0.06
base: ../base/tinystories_10m.yaml
overrides:
  optim.sgd.lr: 0.06
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.01
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [13, 17, 24, 33, 45, 62, 85, 117, 161, 221, 304, 418, 500, 574, 788, 1083, 1487, 1500, 2043, 2500]}
name: "{optimizer}_d{train.data_seed}"
runs:
  - {optimizer: sgd, train.data_seed: [0, 1, 2]}
