# Curvature-balanced per-layer learning rates (optsplit/optim/balance.py) on TinyStories-30M, with the settings that
# did best on TinyStories-10M (ts10m_balanced), from the rates, initialization and data orders of ts30m_main.
suite: ts30m_balanced
base: ../base/tinystories_30m.yaml
overrides:
  optim.sgd.lr: 0.1
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.01
  measure.batch_sharpness_batches: 0
runs:
  - {optimizer: sgd, balance.variant: B, balance.target: 1.0, train.data_seed: [0, 1, 2],
     name: "sgd_B{balance.target}_d{train.data_seed}"}
  - {optimizer: sgd, balance.variant: A, balance.fixed: [[emb]], train.data_seed: [0, 1, 2],
     name: "sgd_A-fe_d{train.data_seed}"}
