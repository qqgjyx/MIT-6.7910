# The parents of ts10m_forks_dense (ts10m_main's d0 runs) continued from their last fork step, 4000, with the
# same optimizer, data order and shadow state, to save fork checkpoints at 60, 75 and 90% of training:
# 6000, 7500, 9000. No Hessian measurements (they do not change the run).
suite: ts10m_parent_late
base: ../base/tinystories_10m.yaml
overrides:
  measure.hessian: false
  measure.delta_loss: false
runs:
  - {fork.parent: ts10m_main/adamw_d0, optimizer: adamw, fork.step: 4000, log.fork_steps: [[6000, 7500, 9000]], name: adamw_d0}
  - {fork.parent: ts10m_main/muon_d0, optimizer: muon, fork.step: 4000, log.fork_steps: [[6000, 7500, 9000]], name: muon_d0}
