# The AdamW<->Muon swaps of ts10m_forks_ckpt again, with checkpoints at three consecutive steps t, t+1, t+2 at the
# fork step s and at s + 5, 10, 25, 50, 100, 250, 500, 1000, 2000, 4000, 6000 (below 9998), and at 9998-10000, so that
# the whole-model metrics (metrics/trajectory.py), the one-step updates included, can be followed right after the swap.
# The swaps at 6000, 7500 and 9000 (60, 75 and 90% of training) fork from ts10m_parent_late, the parents continued.
