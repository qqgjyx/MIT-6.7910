# The AdamW<->Muon swaps of ts10m_forks again, without measurements, with checkpoints also at steps 9998 and 9999, so
# that the last two updates can be read off the weights (metrics/trajectory.py).
suite: ts10m_forks_ckpt
base: ../base/tinystories_10m.yaml
overrides:
  shadow: []
  log.fork_steps: []
  log.ckpt_steps: {every: 1000, geometric: 12, extra: [9998, 9999]}
  measure.hessian: false
  measure.delta_loss: false
runs:
  - {fork.parent: ts10m_main/adamw_d0, optimizer: muon, fork.step: [50, 100, 200, 400, 700, 1000, 1500, 2500, 4000], name: "adamw_to_muon_at{fork.step}"}
  - {fork.parent: ts10m_main/muon_d0, optimizer: adamw, fork.step: [50, 100, 200, 400, 700, 1000, 1500, 2500, 4000], name: "muon_to_adamw_at{fork.step}"}
