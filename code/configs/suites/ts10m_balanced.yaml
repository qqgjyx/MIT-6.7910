# Curvature-balanced per-layer learning rates (optsplit/optim/balance.py) on TinyStories-10M, from the rates,
# initialization and data orders of ts10m_main. Variant A only redistributes the rate across layers; B also scales
# it so that lambda_max of the balanced operator sits at `balance.target` times its stability threshold.
suite: ts10m_balanced
base: ../base/tinystories_10m.yaml
overrides:
  optim.sgd.lr: 0.03
  optim.adamw.lr: 2.0e-3
  optim.muon.lr: 0.01
  measure.batch_sharpness_batches: 0  # its 128-sequence double backward is the memory peak; 3 runs then fit a 44 GB GPU
# Muon is balanced on its spectral-norm sharpness instead of H (see balance.py).
runs:
  - {optimizer: [sgd, adamw, muon], balance.variant: A, train.data_seed: 0, name: "{optimizer}_A_d{train.data_seed}"}
  - {optimizer: [sgd, adamw, muon], balance.variant: B, balance.target: [0.5, 0.7, 0.9, 1.0], train.data_seed: 0,
     name: "{optimizer}_B{balance.target}_d{train.data_seed}"}
  # SGD, second round. sgd_B0.9 blew up at step 3020 with the embedding at 10x: the 32-sequence Hessian batch sees
  # only part of the vocabulary, so the embedding's curvature is underestimated. `-fe`: embedding kept at 1x.
  - {optimizer: sgd, balance.variant: A, balance.fixed: [[emb]], name: "sgd_A-fe_d0"}
  - {optimizer: sgd, balance.variant: B, balance.target: [0.9, 1.0], balance.fixed: [[emb]],
     name: "sgd_B{balance.target}-fe_d0"}
  - {optimizer: sgd, balance.variant: B, balance.target: 1.0, train.data_seed: [1, 2],
     name: "sgd_B{balance.target}_d{train.data_seed}"}
  # AdamW, second round: A was the only variant on par with the baseline (B pushed g down to 0.1 below the target
  # and up to 5-10x above it, both worse). The tracked lambda_max was often below the Lanczos check and the
  # embedding's preconditioned curvature spikes, so `-fe` also keeps the embedding at 1x and tracks 4 vectors with 3
  # iterations. A on data orders 1-2.
  - {optimizer: adamw, balance.variant: A, balance.fixed: [[emb]], balance.k: 4, balance.iters: 3,
     name: "adamw_A-fe_d0"}
  - {optimizer: adamw, balance.variant: A, train.data_seed: [1, 2], name: "adamw_A_d{train.data_seed}"}
